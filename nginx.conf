server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets directly; fall back to index.html for any
    # unmatched path so React Router's client-side routing works
    # (e.g. refreshing on /dashboard doesn't 404).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively (CRA/Vite output filenames
    # include a content hash, so this is safe).
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache index.html itself, so users always get the latest
    # build reference after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}